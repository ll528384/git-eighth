<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记账本</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { padding-top: 64px; }
    section { padding: 40px 0; }
    .tip { color: red; min-height: 20px; }
    .done-delete { cursor: pointer; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">记账本</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#list">记账明细</a></li>
          <li class="nav-item"><a class="nav-link" href="#sum">统计</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="home">
    <div class="container">
      <h1 class="display-5 fw-bold">我的记账本</h1>
      <p class="lead">记下每一笔花销，看清钱去了哪里。</p>
      <a href="#list" class="btn btn-primary">开始记账</a>
    </div>
  </section>

  <section id="list" class="bg-white">
    <div class="container">
      <h2 class="mb-4">记账明细</h2>

      <div class="row g-3 mb-2">
        <div class="col-md-4">
          <label class="form-label">项目</label>
          <input type="text" id="name-input" class="form-control" placeholder="例如：午饭">
        </div>
        <div class="col-md-3">
          <label class="form-label">金额（元）</label>
          <input type="number" id="money-input" class="form-control" placeholder="例如：20">
        </div>
        <div class="col-md-3">
          <label class="form-label">类别</label>
          <select id="type-input" class="form-select">
            <option value="餐饮">餐饮</option>
            <option value="交通">交通</option>
            <option value="购物">购物</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">&nbsp;</label>
          <button id="add-btn" class="btn btn-primary w-100">记一笔</button>
        </div>
      </div>

      <p class="tip" id="tip"></p>

      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>项目</th>
            <th>金额（元）</th>
            <th>类别</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="record-list"></tbody>
      </table>
      <p class="text-muted" id="empty-tip">还没有记账，先记一笔吧。</p>
    </div>
  </section>

  <section id="sum">
    <div class="container">
      <h2 class="mb-4">统计</h2>
      <h5>总支出：<span id="total" style="color:red;">0</span> 元</h5>
      <ul class="list-unstyled mt-3" id="type-sum"></ul>
      <div style="height: 360px;">
        <canvas id="type-chart"></canvas>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    let records = [];

    let listBody = document.getElementById('record-list');
    let tipEl = document.getElementById('tip');
    let emptyEl = document.getElementById('empty-tip');
    let totalEl = document.getElementById('total');
    let typeSumEl = document.getElementById('type-sum');

    let chart = null;
    if (typeof Chart !== 'undefined') {
      let ctx = document.getElementById('type-chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['餐饮', '交通', '购物', '其他'],
          datasets: [{
            label: '支出（元）',
            data: [0, 0, 0, 0],
            backgroundColor: [
              'rgba(255, 99, 132, 0.6)',
              'rgba(54, 162, 235, 0.6)',
              'rgba(255, 206, 86, 0.6)',
              'rgba(75, 192, 192, 0.6)'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: { display: true, text: '各类别支出（元）' }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    function saveRecords() {
      localStorage.setItem('records', JSON.stringify(records));
    }

    function addRecord() {
      let name = document.getElementById('name-input').value;
      let money = document.getElementById('money-input').value;
      let type = document.getElementById('type-input').value;

      if (name === '') {
        tipEl.textContent = '项目不能为空';
        return;
      }
      if (money === '' || Number(money) <= 0) {
        tipEl.textContent = '金额要大于 0';
        return;
      }

      tipEl.textContent = '';

      let one = {
        name: name,
        money: Number(money),
        type: type
      };
      records.push(one);

      saveRecords();
      renderList();
      renderSum();

      document.getElementById('name-input').value = '';
      document.getElementById('money-input').value = '';
    }

    function deleteRecord(i) {
      records.splice(i, 1);
      saveRecords();
      renderList();
      renderSum();
    }

    function renderList() {
      let html = '';
      for (let i = 0; i < records.length; i++) {
        html = html + '<tr>';
        html = html + '<td>' + records[i].name + '</td>';
        html = html + '<td>' + records[i].money + '</td>';
        html = html + '<td>' + records[i].type + '</td>';
        html = html + '<td><span class="text-danger done-delete" data-i="' + i + '">删除</span></td>';
        html = html + '</tr>';
      }
      listBody.innerHTML = html;

      if (records.length === 0) {
        emptyEl.style.display = 'block';
      } else {
        emptyEl.style.display = 'none';
      }
    }

    function renderSum() {
      let total = 0;
      let foodSum = 0;
      let trafficSum = 0;
      let shopSum = 0;
      let otherSum = 0;

      for (let i = 0; i < records.length; i++) {
        total = total + records[i].money;
        if (records[i].type === '餐饮') {
          foodSum = foodSum + records[i].money;
        }
        if (records[i].type === '交通') {
          trafficSum = trafficSum + records[i].money;
        }
        if (records[i].type === '购物') {
          shopSum = shopSum + records[i].money;
        }
        if (records[i].type === '其他') {
          otherSum = otherSum + records[i].money;
        }
      }

      totalEl.textContent = total;
      typeSumEl.innerHTML =
        '<li>餐饮：' + foodSum + ' 元</li>' +
        '<li>交通：' + trafficSum + ' 元</li>' +
        '<li>购物：' + shopSum + ' 元</li>' +
        '<li>其他：' + otherSum + ' 元</li>';

      if (chart !== null) {
        chart.data.datasets[0].data = [foodSum, trafficSum, shopSum, otherSum];
        chart.update();
      }
    }

    listBody.addEventListener('click', function (e) {
      if (e.target.className.indexOf('done-delete') >= 0) {
        let i = Number(e.target.getAttribute('data-i'));
        deleteRecord(i);
      }
    });

    document.getElementById('add-btn').addEventListener('click', addRecord);

    let saved = localStorage.getItem('records');
    if (saved !== null) {
      records = JSON.parse(saved);
    }
    renderList();
    renderSum();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记账本</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { padding-top: 64px; }
    section { padding: 40px 0; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">记账本</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#list">记账明细</a></li>
          <li class="nav-item"><a class="nav-link" href="#sum">统计</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="home">
    <div class="container">
      <h1 class="display-5 fw-bold">我的记账本</h1>
      <p class="lead">记下每一笔花销，看清钱去了哪里。</p>
      <a href="#list" class="btn btn-primary">开始记账</a>
    </div>
  </section>

  <section id="list" class="bg-white">
    <div class="container">
      <h2 class="mb-4">记账明细</h2>

      <div class="row g-3 mb-2">
        <div class="col-md-4">
          <label class="form-label">项目</label>
          <input type="text" class="form-control" placeholder="例如：午饭">
        </div>
        <div class="col-md-3">
          <label class="form-label">金额（元）</label>
          <input type="number" class="form-control" placeholder="例如：20">
        </div>
        <div class="col-md-3">
          <label class="form-label">类别</label>
          <select class="form-select">
            <option value="餐饮">餐饮</option>
            <option value="交通">交通</option>
            <option value="购物">购物</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">&nbsp;</label>
          <button class="btn btn-primary w-100">记一笔</button>
        </div>
      </div>

      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>项目</th>
            <th>金额（元）</th>
            <th>类别</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="text-muted">还没有记账，先记一笔吧。</p>
    </div>
  </section>

  <section id="sum">
    <div class="container">
      <h2 class="mb-4">统计</h2>
      <h5>总支出：0 元</h5>
      <ul class="list-unstyled mt-3">
        <li>餐饮：0 元</li>
        <li>交通：0 元</li>
        <li>购物：0 元</li>
        <li>其他：0 元</li>
      </ul>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
